# homelab 机器清单 —— fleet.sh 读取此文件
#
# 格式：  名称        地址            分组（逗号分隔，无空格）
# 以 # 开头和空行忽略。
#
# 「分组」用来批量选取，例如：
#     ./fleet.sh exec gateway -- 'systemctl status mihomo'
#     ./fleet.sh run  k8s     -- fix-root-residue.sh --check
# all 是内置目标，匹配本文件里的所有机器（不用写进分组列）。
#
# 🔴 地址要和 docs/02 的 IP 规划表保持一致，改了记得两边都改。

